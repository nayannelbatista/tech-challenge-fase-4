name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      confirm_aws_deploy:
        description: Confirm that AWS resources may be created or updated by this run.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-serverless-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_aws_deploy }}
    runs-on: ubuntu-latest
    environment: aws-deploy-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fiap-feedback-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - run: mvn --batch-mode test package
      - run: sam validate --lint
      - run: sam build
      - name: Deploy stack
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: >-
          sam deploy --stack-name fiap-feedback --resolve-s3 --capabilities CAPABILITY_IAM
          --region "${{ vars.AWS_REGION }}"
          --parameter-overrides "AdminEmail=${ADMIN_EMAIL}"
          --no-confirm-changeset --no-fail-on-empty-changeset
